<!-- templates/index.html -->
<!DOCTYPE html>
<html>
<head>
    <title>Minhas Tarefas</title>
</head>
<body>
    <h1>Lista de Tarefas</h1>
    
    <ul>
        {% for tarefa in tarefas %}
            <li>
                {{ tarefa }}
                <form action="/remover" method="POST" style="display:inline;">
                    <input type="hidden" name="tarefa" value="{{ tarefa }}">
                    <button type="submit">Remover</button>
                </form>
            </li>
        {% endfor %}
    </ul>

    <!-- Formulário para adicionar nova tarefa -->
    <form action="/adicionar" method="POST">
        <input type="text" name="nova_tarefa" placeholder="Nova tarefa">
        <button type="submit">Adicionar</button>
    </form>

    <p style="color: blue;">Tente adicionar uma tarefa vazia e depois recarregar a página. Ou adicione e remova rapidamente.</p>
</body>
</html>
